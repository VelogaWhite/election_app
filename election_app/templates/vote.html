{% extends 'base.html' %}

{% block title %}เลือก สส เขต{% endblock %}

{% block content %}
    <div class="bg-white rounded-xl shadow-md overflow-hidden">
        <div class="bg-blue-600 px-6 py-4">
            <h2 class="text-xl font-bold text-white uppercase tracking-wide text-center">เลือก สส เขต</h2>
        </div>
        <div class="p-8">
            <div class="mb-8 p-4 bg-blue-50 border-l-4 border-blue-500 rounded text-blue-700">
                <span class="font-bold">เขตการเลือกตั้ง:</span> {{ election.name }}
            </div>

            <form method="POST" action="" class="space-y-6">
                {% csrf_token %}
                <div>
                    <label for="id_candidate" class="block text-gray-700 font-semibold mb-2 text-lg">เลือกผู้สมัครที่คุณต้องการ</label>
                    <div class="relative">
                        <select name="candidate" id="id_candidate" class="block w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 p-3 appearance-none">
                            {% for candidate in candidates %}
                                <option value="{{ candidate.id }}">{{ candidate.name }}</option>
                            {% endfor %}
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700">
                            <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                        </div>
                    </div>
                </div>
                
                <div class="pt-4 text-center">
                    <button type="submit" id="id_confirm_button" class="w-full md:w-auto bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-12 rounded-lg transition duration-300 shadow-md">
                        ยืนยันการเลือกตั้ง
                    </button>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
