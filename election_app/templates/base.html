{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ระบบเลือกตั้งออนไลน์{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <header class="bg-blue-600 text-white shadow-lg">
        <div class="container mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center">
            <h1 class="text-2xl font-bold mb-4 md:mb-0 italic tracking-wider">
                <a href="{% url 'home' %}">ELECTION APP</a>
            </h1>
            <nav>
                <ul class="flex space-x-6 text-sm md:text-base font-medium">
                    <li><a href="{% url 'home' %}" class="hover:text-blue-200 transition">หน้าแรก</a></li>
                    <li><a href="{% url 'vote' %}" class="hover:text-blue-200 transition">ลงคะแนนเสียง</a></li>
                    <li><a href="{% url 'results' %}" class="hover:text-blue-200 transition">ผลการเลือกตั้ง</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container mx-auto px-4 py-10 flex-grow">
        <div class="max-w-4xl mx-auto">
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <footer class="bg-gray-800 text-white py-6 mt-auto">
        <div class="container mx-auto px-4 text-center">
            <p class="text-gray-400 text-sm">&copy; 2026 ระบบเลือกตั้งออนไลน์ - พัฒนาด้วยความโปร่งใส</p>
        </div>
    </footer>
</body>
</html>
